services:
  - type: web
    name: flac-play
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TEMP_DIR
        value: /tmp/flacplay
      - key: UPSTREAM_API
        sync: false
      - key: NETEASE_NATIVE
        value: "true"
      - key: NETEASE_COOKIE
        sync: false
