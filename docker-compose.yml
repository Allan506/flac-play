services:
  flacplay:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "12000:12000"
    environment:
      NODE_ENV: production
      PORT: "12000"
      TEMP_DIR: /tmp/flacplay
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:12000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
